name: CI

on:
    push:
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest

        env:
            APP_ENV: test
            APP_SECRET: test-secret
            DATA_PATH: var/pulse_test.json
            JWT_SECRET: e070e6d4c2ab1ff06b428f5bc833b75fac92783236719e1f

        steps:
            - name: Récupérer le code
              uses: actions/checkout@v7

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: ctype, iconv
                  tools: composer:v2
                  coverage: none

            - name: Vérifier Composer
              run: composer validate --strict

            - name: Installer les dépendances
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Vérifier la syntaxe PHP
              run: find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

            - name: Vérifier le conteneur Symfony
              run: php bin/console lint:container --env=test

            - name: Exécuter les tests
              run: php bin/phpunit
